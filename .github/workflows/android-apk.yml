name: Android APK
on:
  push:
    branches: [main]
    paths:
      - 'chatgptbrowser/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatgptbrowser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --stacktrace --no-daemon assembleDebug
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-browser-debug-apk
          path: chatgptbrowser/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create browser-debug app/build/outputs/apk/debug/app-debug.apk --title 'ChatGPT Browser Debug APK' --notes 'Experimental Android WebView build; login may not work.' --prerelease || gh release upload browser-debug app/build/outputs/apk/debug/app-debug.apk --clobber

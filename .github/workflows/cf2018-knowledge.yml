name: CF2018 Knowledge Validation

on:
  push:
    paths:
      - 'cf2018/**'
      - 'cf2018v2/**'
      - '.github/workflows/cf2018-knowledge.yml'
  pull_request:
    paths:
      - 'cf2018/**'
      - 'cf2018v2/**'
      - '.github/workflows/cf2018-knowledge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate required files, links, Vault and curated edges
        run: cd cf2018 && python tools/knowledge.py doctor
      - name: Run knowledge tests
        run: cd cf2018 && python -m unittest discover -s tests -v
      - name: Sample ICM route
        run: cd cf2018 && python tools/knowledge.py route tgcp ack
      - name: Render Graphify relationships
        run: cd cf2018 && python tools/knowledge.py graph > /tmp/cf2018-graph.md

      - name: Validate CF2018v2 knowledge links, graph and diary limits
        run: cd cf2018v2 && python tools/knowledge.py doctor
      - name: Verify CF2018v2 gameplay evidence route
        run: |
          cd cf2018v2
          python tools/knowledge.py route training map > /tmp/cf2018v2-route.txt
          grep -q 'vault/R055_OBB_SPLIT_ASSET_TRIAGE.md' /tmp/cf2018v2-route.txt
